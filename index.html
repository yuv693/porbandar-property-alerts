<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porbandar Auction & Tender Portal</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 15px; 
            text-align: center; 
        }
        .container { 
            max-width: 450px; 
            margin: 15px auto; 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { 
            color: #333; 
            margin-bottom: 15px; 
            font-size: 20px; 
        }
        .box-section { 
            background: #fafafa; 
            border: 1px solid #e0e0e0; 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            text-align: left; 
        }
        .section-title { 
            font-size: 14px; 
            font-weight: bold; 
            color: #1a73e8; 
            margin-bottom: 8px; 
        }
        textarea { 
            width: 100%; 
            height: 95px; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            font-size: 13px; 
            box-sizing: border-box; 
            outline: none; 
            resize: none; 
            font-family: inherit; 
            margin-top: 5px; 
        }
        .btn-blue { 
            background-color: #1a73e8; 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 14px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 8px; 
        }
        .btn-green { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 10px; 
            font-size: 13px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 8px; 
        }
        .btn-orange { 
            background-color: #ff851b; 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 14px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 8px; 
        }
        .btn-gemini { 
            background-color: #0d6efd; 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 14px; 
            font-weight: bold; 
            border-radius: 8px; 
            text-decoration: none; 
            display: block; 
            margin-top: 8px; 
            text-align: center; 
            display: none; 
        }
        .btn-whatsapp { 
            background-color: #25D366; 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 14px; 
            font-weight: bold; 
            border-radius: 8px; 
            text-decoration: none; 
            display: block; 
            margin-bottom: 15px; 
            text-align: center; 
        }
        
        /* Property Cards Style */
        .property-card { 
            background: #fff; 
            border: 1px solid #1a73e8; 
            padding: 12px; 
            border-radius: 8px; 
            margin-top: 12px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        .property-text { 
            font-size: 13px; 
            white-space: pre-wrap; 
            background: #f9f9f9; 
            padding: 8px; 
            border-radius: 5px; 
            border: 1px solid #eee; 
            margin-bottom: 8px; 
            max-height: 220px; 
            overflow-y: auto; 
            text-align: left; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Porbandar Auction & Tenders</h2>

        <!-- DIRECT WHATSAPP GROUP LINK BUTTON -->
        <a href="https://chat.whatsapp.com/GkkqH2u5bB9G8yVain2KdX?s=cl&p=a&mlu=4&ilr=4" target="_blank" class="btn-whatsapp">
            💬 Join Our WhatsApp Group
        </a>

        <!-- BOX 1: BANK AUCTION PROMPT -->
        <div class="box-section">
            <div class="section-title">1️⃣ Bank Auction (SARFAESI) Prompt</div>
            <button class="btn-blue" onclick="prepareBankPrompt()">🔍 Create Bank Search Prompt</button>

            <div id="bankResultBox" style="display:none; margin-top: 10px;">
                <textarea id="bankFinalPrompt" readonly></textarea>
                <button class="btn-green" onclick="copyPrompt('bankFinalPrompt', 'bankGeminiBtn')">📋 Copy Bank Prompt</button>
                <a href="https://gemini.google.com" target="_blank" class="btn-gemini" id="bankGeminiBtn">🌐 Open Gemini & Search</a>
            </div>
        </div>

        <!-- BOX 2: NAGARPALIKA & GOVT COMMERCIAL PLOTS / TENDERS PROMPT -->
        <div class="box-section">
            <div class="section-title">2️⃣ Nagarpalika & Govt Commercial Plots Prompt</div>
            <button class="btn-orange" onclick="prepareGovtPrompt()">🏛️ Create Govt/Plot Search Prompt</button>

            <div id="govtResultBox" style="display:none; margin-top: 10px;">
                <textarea id="govtFinalPrompt" readonly></textarea>
                <button class="btn-green" onclick="copyPrompt('govtFinalPrompt', 'govtGeminiBtn')">📋 Copy Govt Prompt</button>
                <a href="https://gemini.google.com" target="_blank" class="btn-gemini" id="govtGeminiBtn">🌐 Open Gemini & Tenders</a>
            </div>
        </div>

        <!-- BOX 3: SEPARATE BULK DETAILS INTO INDIVIDUAL CARDS -->
        <div class="box-section">
            <div class="section-title">3️⃣ Gemini Result Paste Karo (Cards)</div>
            <textarea id="bulkInput" placeholder="Gemini ka pura response yahan paste karo..."></textarea>
            <button class="btn-blue" onclick="splitProperties()">✂️ Alag-Alag Cards Banao</button>
            
            <div id="cardsContainer" style="margin-top: 15px;"></div>
        </div>

    </div>

    <script>
        const WA_GROUP_LINK = "https://chat.whatsapp.com/GkkqH2u5bB9G8yVain2KdX?s=cl&p=a&mlu=4&ilr=4";

        const BANK_FORMAT = `Aapko har ek property ki report strictly isi clean Gujarati format me deni hai:

🚨 પોરબંદર બેંક હરાજી (SARFAESI Auction Notice) 🚨

📍 મિલકત વિગત: [Property Type & Description]
📍 સંપૂર્ણ સરનામું (Full Address): [Flat/Plot No, Building/Society, Revenue/City Survey No, Area, Taluka (Porbandar/Ranavav/Kutiyana/Ranakandora), Gujarat]
👤 મિલકતના માલિક / બોરોઅर (Owner/Borrower): [Full Name of Property Owner and Borrower Firm]
📐 ક્ષેત્રફળ (Area): [Land/Built-up Area in Sq Yards/Meters if available, else N/A]
🧱 ચતુર્સીમા (Boundaries): [North, South, East, West boundaries if available, else N/A]
🏦 બેંકનું નામ: [Bank Name & Branch]
🆔 પ્રોપર્ટી ID: [Property ID if available, else N/A]
💰 રિઝર્વ પ્રાઇસ (અંદાજિત રકમ): ₹ [Amount]/-
💵 ઈ.એમ.ડી. રકમ: ₹ [Amount]/-
📅 હરાજી તારીખ: [Date]

⚠️ ખાસ નોંધ: આ માહિતી માત્ર જાણકારી માટે છે. બોલી લગાવતા પહેલા બેંક શાખાનો સંપર્ક કરી અધિકૃત નોટિસ ચકાસી લેવી.

📲 વધુ નવી હરાજીની માહિતી માટે અમારા વોટ્સએપ ગ્રુપમાં જોડાઓ:
${WA_GROUP_LINK}`;

        const GOVT_FORMAT = `Aapko har ek government tender ya nagarpalika open commercial plot/shop auction ki report strictly isi clean Gujarati format me deni hai:

🏛️ પોરબંદર નગરપાલિકા / સરકારી હરાજી (Government & Municipal Plot Auction) 🏛️

📍 મિલકત વિગત: [Commercial Open Plot / Shop / Work Details]
📍 સંપૂર્ણ સરનામું (Full Address): [Plot/Shop No, Revenue/City Survey No, Area, Taluka (Porbandar/Ranavav/Kutiyana), Gujarat]
👤 મિલકત ધારક / અરજદાર (Owner/Allottee): [Name if available, else N/A]
🧭 ચતુર્સીમા (Boundaries): [North, South, East, West boundaries if available, else N/A]
📐 ક્ષેત્રફળ (Area): [Land Area in Sq Meters / Sq Yards / Sq Feet if available, else N/A]
🏢 વિભાગ / સંસ્થા: [Porbandar Nagarpalika / Collector Office / Govt Dept]
🆔 પ્રોપર્ટી / ટેન્ડર ID: [Property/Tender ID if available, else N/A]
💰 રિઝર્વ પ્રાઇસ / ડિપોઝિટ: ₹ [Amount]/-
💵 ઈ.એમ.ડી. રકમ: ₹ [Amount]/-
📅 હરાજી તારીખ / છેલ્લી તારીખ: [Date]

⚠️ ખાસ નોંધ: આ માહિતી માત્ર જાણકારી માટે છે. વિગતવાર માહિતી માટે સંબંધિત કચેરીનો સંપર્ક કરવો.

📲 વધુ નવી હરાજીની માહિતી માટે અમારા વોટ્સએપ ગ્રુપમાં જોડાઓ:
${WA_GROUP_LINK}`;

        function prepareBankPrompt() {
            const today = new Date();
            const dateString = today.getDate() + "/" + (today.getMonth() + 1) + "/" + today.getFullYear();

            const prompt = `Search all ACTIVE & UPCOMING SARFAESI bank auction properties in Porbandar district, Gujarat (including Porbandar City, Ranavav, Kutiyana, and Ranakandora/Ranakandhora villages).

STRICT RULES TO FOLLOW:
1. DATE FILTER: ONLY include auction notices where the Auction Date is AFTER TODAY (${dateString}). DO NOT include past or expired auction dates.
2. PRICE MANDATORY: Include exact numerical Reserve Price (Amount in ₹) and EMD Amount. Do NOT write "N/A" for Price or EMD.
3. FULL LEGAL DETAILS & OWNER NAME: Must include exact full address with Revenue/City Survey numbers, and full Property Owner / Borrower Name.
4. DO NOT include any Google Maps links or markdown URL brackets. Write simple plain text.

Har ek property ki report ko strictly is Gujarati format me likho:
${BANK_FORMAT}`;

            document.getElementById("bankFinalPrompt").value = prompt;
            document.getElementById("bankResultBox").style.display = "block";
            document.getElementById("bankGeminiBtn").style.display = "block";
        }

        function prepareGovtPrompt() {
            const today = new Date();
            const dateString = today.getDate() + "/" + (today.getMonth() + 1) + "/" + today.getFullYear();

            const prompt = `Search active public commercial open plots, land auctions, shop leases, or tenders by Porbandar Nagarpalika, Collectorate, or local government bodies in Porbandar, Gujarat.

STRICT RULES TO FOLLOW:
1. DATE FILTER: ONLY include notices where the Auction / Tender Last Date is AFTER TODAY (${dateString}). DO NOT include past or expired dates.
2. PRICE MANDATORY: Include exact numerical Reserve Price / Tender Deposit Amount in ₹. Do NOT write "N/A" for Price or EMD.
3. FULL LEGAL DETAILS & OWNER/APPLICANT NAME: Must include complete full address with Survey numbers, and Owner / Applicant name if available.
4. DO NOT include any Google Maps links or markdown URL brackets. Write simple plain text.

Har ek item ki report ko strictly is Gujarati format me likho:
${GOVT_FORMAT}`;

            document.getElementById("govtFinalPrompt").value = prompt;
            document.getElementById("govtResultBox").style.display = "block";
            document.getElementById("govtGeminiBtn").style.display = "block";
        }

        function copyPrompt(textareaId, geminiBtnId) {
            const textarea = document.getElementById(textareaId);
            textarea.select();
            document.execCommand("copy");
            alert("✅ Search Prompt Copied! Ab Gemini me paste kar do.");
        }

        function splitProperties() {
            const bulkText = document.getElementById("bulkInput").value.trim();
            const container = document.getElementById("cardsContainer");
            container.innerHTML = ""; 

            if(!bulkText) {
                alert("⚠️ Pehle Gemini ka jawab paste karo!");
                return;
            }

            let parts = bulkText.split(/🚨|🏛️|પોરબંદર/g);
            let count = 0;

            parts.forEach((part) => {
                let cleaned = part.trim();
                if(cleaned.length > 30) {
                    count++;
                    let fullNoticeText = (bulkText.includes("🏛️") ? "🏛️ " : "🚨 ") + "પોરબંદર " + cleaned;

                    let card = document.createElement("div");
                    card.className = "property-card";
                    card.innerHTML = `
                        <div style="font-size: 12px; font-weight: bold; color: #1a73e8; margin-bottom: 5px;">Item #${count}</div>
                        <div class="property-text" id="prop_${count}">${fullNoticeText}</div>
                        <button class="btn-green" onclick="copySpecificProperty('prop_${count}')">📋 Copy Item #${count}</button>
                    `;
                    container.appendChild(card);
                }
            });

            if(count === 0) {
                alert("⚠️ Text divide nahi ho paya. Clean response paste karein.");
            } else {
                alert(`✅ Total ${count} items ke cards ban gaye hain!`);
            }
        }

        function copySpecificProperty(elementId) {
            const textElement = document.getElementById(elementId);
            const range = document.createRange();
            range.selectNode(textElement);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand("copy");
            window.getSelection().removeAllRanges();
            alert("✅ Card Copied! Ab WhatsApp group par paste kar do.");
        }
    </script>

</body>
</html>
