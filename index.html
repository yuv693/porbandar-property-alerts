<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porbandar SARFAESI Auction Helper</title>
    
    <!-- PWA Web App Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 450px; margin: 15px auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 15px; font-size: 20px; }
        .box-section { background: #fafafa; border: 1px solid #e0e0e0; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; }
        .section-title { font-size: 14px; font-weight: bold; color: #1a73e8; margin-bottom: 8px; }
        textarea { width: 100%; height: 95px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; box-sizing: border-box; outline: none; resize: none; font-family: inherit; margin-top: 5px; }
        .btn-blue { background-color: #1a73e8; color: white; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 8px; }
        .btn-green { background-color: #28a745; color: white; border: none; padding: 10px; font-size: 13px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 8px; }
        .btn-gemini { background-color: #0d6efd; color: white; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 8px; text-decoration: none; display: block; margin-top: 8px; text-align: center; display: none; }
        .btn-whatsapp { background-color: #25D366; color: white; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 8px; text-decoration: none; display: block; margin-bottom: 15px; text-align: center; }
        
        /* Property Cards Style */
        .property-card { background: #fff; border: 1px solid #28a745; padding: 12px; border-radius: 8px; margin-top: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .property-text { font-size: 13px; white-space: pre-wrap; background: #f9f9f9; padding: 8px; border-radius: 5px; border: 1px solid #eee; margin-bottom: 8px; max-height: 200px; overflow-y: auto; text-align: left; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Porbandar Bank Auction</h2>

        <!-- DIRECT WHATSAPP GROUP LINK BUTTON -->
        <a href="https://chat.whatsapp.com/GkkqH2u5bB9G8yVain2KdX?s=cl&p=a&mlu=4&ilr=4" target="_blank" class="btn-whatsapp">
            💬 Join Our WhatsApp Group
        </a>

        <!-- BOX 1: AUTO SEARCH PROMPT (NO MAP LINK) -->
        <div class="box-section">
            <div class="section-title">1️⃣ Live Search Prompt (Clean Format)</div>
            <button class="btn-blue" onclick="prepareSearchPrompt()">🔍 Create Search Prompt</button>

            <div id="searchResultBox" style="display:none; margin-top: 10px;">
                <textarea id="searchFinalPrompt" readonly></textarea>
                <button class="btn-green" onclick="copyPrompt('searchFinalPrompt', 'searchGeminiBtn')">📋 Copy Search Prompt</button>
                <a href="https://gemini.google.com" target="_blank" class="btn-gemini" id="searchGeminiBtn">🌐 Open Gemini & Search</a>
            </div>
        </div>

        <!-- BOX 2: SEPARATE BULK DETAILS INTO INDIVIDUAL CARDS -->
        <div class="box-section">
            <div class="section-title">2️⃣ Gemini Result Paste Karo (Cards Banane Ke Liye)</div>
            <textarea id="bulkInput" placeholder="Gemini ka pura response yahan paste karo..."></textarea>
            <button class="btn-blue" onclick="splitProperties()">✂️ Alag-Alag Property Cards Banao</button>
            
            <div id="cardsContainer" style="margin-top: 15px;"></div>
        </div>

    </div>

    <script>
        const WA_GROUP_LINK = "https://chat.whatsapp.com/GkkqH2u5bB9G8yVain2KdX?s=cl&p=a&mlu=4&ilr=4";

        const GUJARATI_FORMAT = `Aapko har ek property ki report strictly isi clean Gujarati format me deni hai:

🚨 પોરબંદર બેંક હરાજી (SARFAESI Auction Notice) 🚨

📍 મિલકત વિગત: [Property Type & Details]
📍 સંપૂર્ણ સરનામું: [Complete Property Address with House/Plot No, Building/Society, Area, Porbandar, Gujarat]
🏦 બેંકનું નામ: [Bank Name]
💰 રિઝર્વ પ્રાઇસ (અંદાજિત રકમ): ₹ [Amount]/-
💵 ઈ.એમ.ડી. રકમ: ₹ [Amount]/-
📅 હરાજી તારીખ: [Date]

⚠️ ખાસ નોંધ: આ માહિતી માત્ર જાણકારી માટે છે. બોલી લગાવતા પહેલા બેંક શાખાનો સંપર્ક કરી અધિકૃત નોટિસ ચકાસી લેવી.

📲 વધુ નવી હરાજીની માહિતી માટે અમારા વોટ્સએપ ગ્રુપમાં જોડાઓ:
${WA_GROUP_LINK}`;

        function prepareSearchPrompt() {
            const prompt = `Bank auction property details dhoondo. Location: Porbandar, Gujarat. Bank: SBI, BOB, PNB, Canara, Union Bank, HDFC, ICICI, etc.

IMPORTANT RULES:
1. Google Maps ka koi bhi link ya URL BILKUL MAT DALO.
2. Property Address ekdam FULL aur CLEAR likho (Flat/Plot No., Building/Society, Landmark, Area Name, Porbandar, Gujarat).

Har ek property ki report ko strictly is Gujarati format me likho:
${GUJARATI_FORMAT}`;

            document.getElementById("searchFinalPrompt").value = prompt;
            document.getElementById("searchResultBox").style.display = "block";
            document.getElementById("searchGeminiBtn").style.display = "block";
        }

        function copyPrompt(textareaId, geminiBtnId) {
            const textarea = document.getElementById(textareaId);
            textarea.select();
            document.execCommand("copy");
            alert("✅ Clean Prompt Copied! Ab Gemini me paste kar do.");
        }

        function splitProperties() {
            const bulkText = document.getElementById("bulkInput").value.trim();
            const container = document.getElementById("cardsContainer");
            container.innerHTML = ""; 

            if(!bulkText) {
                alert("⚠️ Pehle Gemini ka jawab paste karo!");
                return;
            }

            let parts = bulkText.split(/🚨|પોરબંદર બેંક હરાજી/g);
            let count = 0;

            parts.forEach((part) => {
                let cleaned = part.trim();
                if(cleaned.length > 30) {
                    count++;
                    let fullNoticeText = "🚨 પોરબંદર બેંક હરાજી " + cleaned;

                    let card = document.createElement("div");
                    card.className = "property-card";
                    card.innerHTML = `
                        <div style="font-size: 12px; font-weight: bold; color: #28a745; margin-bottom: 5px;">Property #${count}</div>
                        <div class="property-text" id="prop_${count}">${fullNoticeText}</div>
                        <button class="btn-green" onclick="copySpecificProperty('prop_${count}')">📋 Copy Property #${count}</button>
                    `;
                    container.appendChild(card);
                }
            });

            if(count === 0) {
                parts = bulkText.split(/\n\s*\n/);
                parts.forEach((part) => {
                    let cleaned = part.trim();
                    if(cleaned.length > 20) {
                        count++;
                        let card = document.createElement("div");
                        card.className = "property-card";
                        card.innerHTML = `
                            <div style="font-size: 12px; font-weight: bold; color: #28a745; margin-bottom: 5px;">Property #${count}</div>
                            <div class="property-text" id="prop_alt_${count}">${cleaned}</div>
                            <button class="btn-green" onclick="copySpecificProperty('prop_alt_${count}')">📋 Copy Property #${count}</button>
                        `;
                        container.appendChild(card);
                    }
                });
            }

            if(count === 0) {
                alert("⚠️ Text divide nahi ho paya. Responce check karein.");
            } else {
                alert(`✅ Total ${count} properties ke cards ban gaye hain!`);
            }
        }

        function copySpecificProperty(elementId) {
            const textElement = document.getElementById(elementId);
            const range = document.createRange();
            range.selectNode(textElement);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand("copy");
            window.getSelection().removeAllRanges();
            alert("✅ Property Card Copied! Ab WhatsApp par paste kar do.");
        }

        // --- Service Worker Registration for PWA ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker Registered Successfully!'))
                    .catch(err => console.log('Service Worker Registration Failed:', err));
            });
        }
    </script>

</body>
</html>
