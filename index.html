<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>પોરબંદર બેંક હરાજી (Porbandar Bank Auctions)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <header class="app-header">
    <h1>🏛️ પોરબંદર બેંક હરાજી (Auctions)</h1>
    <p>Porbandar & Local Bank Auction Properties</p>
  </header>

  <div class="filter-container">
    <input type="text" id="searchInput" placeholder="🔍 સર્ચ કરો (Area, Bank, Type)..." onkeyup="filterProperties()">
    
    <div class="select-group">
      <select id="areaFilter" onchange="filterProperties()">
        <option value="ALL">બધા વિસ્તારો (All Areas)</option>
        <option value="Chhaya">છાયા (Chhaya)</option>
        <option value="MG Road">એમ.જી. રોડ (MG Road)</option>
        <option value="Khapat">ખપટ (Khapat)</option>
        <option value="Dharampur">ધરમપુર (Dharampur)</option>
        <option value="Rokadiya Hanuman">રોકડિયા હનુમાન</option>
      </select>

      <select id="statusFilter" onchange="filterProperties()">
        <option value="ALL">બધા ઓક્શન (All Status)</option>
        <option value="Upcoming">🔴 ઓપન / લાઈવ હરાજી</option>
        <option value="Expired">🟡 પુરાણું ડેટા (Archive)</option>
      </select>
    </div>
  </div>

  <div class="property-grid" id="propertyContainer">
    <!-- Dynamic Cards app.js se load honge -->
  </div>

  <script src="app.js"></script>
</body>
</html>
