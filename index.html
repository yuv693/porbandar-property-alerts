<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porbandar SARFAESI Auction Helper</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 450px;
            margin: 30px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .btn-auction {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: 0.2s;
        }
        .btn-auction:hover {
            background-color: #1ebe57;
        }
        .chat-box {
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fafafa;
            text-align: left;
            display: flex;
            flex-direction: column;
            height: 380px;
        }
        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: 14px;
            white-space: pre-wrap;
        }
        .msg-user {
            background: #0d6efd;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            align-self: flex-end;
            max-width: 80%;
        }
        .msg-gemini {
            background: #e9ecef;
            color: #212529;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            align-self: flex-start;
            max-width: 90%;
            font-family: monospace, sans-serif;
        }
        .input-area {
            display: flex;
            border-top: 1px solid #ddd;
            padding: 8px;
            background: #fff;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }
        .input-area button {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 8px 14px;
            margin-left: 6px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Porbandar Bank Auction</h2>
        
        <!-- Quick Action Button -->
        <button class="btn-auction" onclick="getAuctionReport()">
            📱 Get WhatsApp Auction Report
        </button>

        <!-- Built-in Gemini Chatbox -->
        <div class="chat-box">
            <div id="chatMessages" class="chat-messages">
                <div class="msg-gemini">👋 Namaste! Upar button dabao, Porbandar auction report direct Gujarati format me yahin ban jayegi.</div>
            </div>
            <div class="input-area">
                <input type="text" id="customInput" placeholder="Sawal poocho..." onkeypress="if(event.key==='Enter') sendCustomMessage()">
                <button onclick="sendCustomMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // 🔑 YAHAN APNI GEMINI API KEY PASTE KARO:
        const GEMINI_API_KEY = "YAHAN_APNI_API_KEY_PASTE_KARO";

        // Fixed Gujarati Format System Prompt
        const SYSTEM_PROMPT = `Aapko Porbandar SARFAESI bank auction report strictly isi Gujarati format me deni hai:

🚨 પોરબંદર બેંક હરાજી (SARFAESI Auction Notice) 🚨
📍 મિલકત વિગત: [Details]
📍 સરનામું: [Address], પોરબંદર, ગુજરાત.
🏦 બેંકનું નામ: [Bank Name]
💰 રિઝર્વ પ્રાઇસ (અંદાજિત રકમ): ₹ [Amount]/-
💵 ઈ.એમ.ડી. રકમ: ₹ [Amount]/-
📅 હરાજી તારીખ: [Date]
📍 ગૂગલ મેપ લોકેશન જુઓ:
https://maps.google.com/?q=Porbandar
⚠️ ખાસ નોંધ: આ માહિતી માત્ર જાણકારી માટે છે. બોલી લગાવતા પહેલા બેંક શાખાનો સંપર્ક કરી અધિકૃત નોટિસ ચકાસી લેવી.
📲 વધુ નવી હરાજીની માહિતી માટે અમારા વોટ્સએપ ગ્રુપમાં જોડાઓ:
[WhatsApp Group Link]`;

        function getAuctionReport() {
            const userQuery = "Porbandar active bank auction report do with Google Maps and notice links in Gujarati format";
            appendMessage("User", "Porbandar Auction Report Banao");
            callGeminiAPI(SYSTEM_PROMPT + "\n\nUser Query: " + userQuery);
        }

        function sendCustomMessage() {
            const input = document.getElementById("customInput");
            const text = input.value.trim();
            if(!text) return;
            appendMessage("User", text);
            input.value = "";
            callGeminiAPI(SYSTEM_PROMPT + "\n\nUser Query: " + text);
        }

        function appendMessage(sender, text) {
            const box = document.getElementById("chatMessages");
            const div = document.createElement("div");
            div.className = sender === "User" ? "msg-user" : "msg-gemini";
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        async function callGeminiAPI(promptText) {
            if (GEMINI_API_KEY === "YAHAN_APNI_API_KEY_PASTE_KARO" || !GEMINI_API_KEY) {
                appendMessage("Gemini", "⚠️ Pehle code me apni GEMINI_API_KEY daalo!");
                return;
            }

            appendMessage("Gemini", "Generating Gujarati Report...");

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();
                const box = document.getElementById("chatMessages");
                box.removeChild(box.lastChild);

                if(data.candidates && data.candidates[0].content.parts[0].text) {
                    appendMessage("Gemini", data.candidates[0].content.parts[0].text);
                } else {
                    appendMessage("Gemini", "❌ Error getting response.");
                }
            } catch (err) {
                console.error(err);
                const box = document.getElementById("chatMessages");
                box.removeChild(box.lastChild);
                appendMessage("Gemini", "❌ Connection Error!");
            }
        }
    </script>

</body>
</html>
