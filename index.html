<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porbandar SARFAESI Auction Helper</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 450px; margin: 30px auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 20px; }
        .btn-gemini { background-color: #1a73e8; color: white; border: none; padding: 15px 20px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; box-shadow: 0 4px 8px rgba(0,0,0,0.15); margin-bottom: 15px; text-decoration: none; display: block; box-sizing: border-box; }
        .btn-gemini:hover { background-color: #1557b0; }
        .btn-whatsapp { background-color: #25D366; color: white; border: none; padding: 15px 20px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; box-shadow: 0 4px 8px rgba(0,0,0,0.15); text-decoration: none; display: block; box-sizing: border-box; }
        .box { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: left; margin-top: 15px; font-size: 14px; }
        textarea { width: 100%; height: 100px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; resize: none; margin-top: 8px; font-family: inherit; }
        .copy-btn { background: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 8px; width: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Porbandar Bank Auction</h2>

        <!-- Step 1: Open Official Gemini -->
        <a href="https://gemini.google.com" target="_blank" class="btn-gemini">
            🌐 Open Google Gemini (Free Web)
        </a>

        <!-- Step 2: Format & Copy Box -->
        <div class="box">
            <strong>📋 Gujarati Format (Copy karke Gemini me paste karein):</strong>
            <textarea id="formatText" readonly>🚨 પોરબંદર બેંક હરાજી (SARFAESI Auction Notice) 🚨
📍 મિલકત વિગત: 
📍 સરનામું: પોરબંદર, ગુજરાત.
🏦 બેંકનું નામ: 
💰 રિઝર્વ પ્રાઇસ: ₹ 
💵 ઈ.એમ.ડી. રકમ: ₹ 
📅 હરાજી તારીખ: 
📍 ગૂગલ મેપ લોકેશન: https://maps.google.com/?q=Porbandar
⚠️ ખાસ નોંધ: આ માહિતી માત્ર જાણકારી માટે છે.</textarea>
            <button class="copy-btn" onclick="copyFormat()">📋 Copy Format</button>
        </div>

        <div style="margin-top: 20px;">
            <a href="https://wa.me/?text=Porbandar%20Auction%20Report" target="_blank" class="btn-whatsapp">
                📲 Share to WhatsApp
            </a>
        </div>
    </div>

    <script>
        function copyFormat() {
            const textarea = document.getElementById("formatText");
            textarea.select();
            document.execCommand("copy");
            alert("✅ Format Copied! Ab Gemini me paste karke report bana lo.");
        }
    </script>

</body>
</html>
