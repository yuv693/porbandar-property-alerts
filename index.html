<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porbandar Auction & Tender Portal</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 15px; 
            text-align: center; 
        }
        .container { 
            max-width: 450px; 
            margin: 15px auto; 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { 
            color: #333; 
            margin-bottom: 15px; 
            font-size: 20px; 
        }
        .box-section { 
            background: #fafafa; 
            border: 1px solid #e0e0e0; 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            text-align: left; 
        }
        .section-title { 
            font-size: 14px; 
            font-weight: bold; 
            color: #1a73e8; 
            margin-bottom: 8px; 
        }
        textarea { 
            width: 100%; 
            height: 100px; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            font-size: 13px; 
            box-sizing: border-box; 
            outline: none; 
            resize: none; 
            font-family: inherit; 
            margin-top: 5px; 
        }
        .btn-blue { 
            background-color: #1a73e8; 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 14px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 8px; 
        }
        .btn-gold { 
            background-color: #d4af37; 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 14px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 8px; 
        }
        .btn-green { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 13px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 8px; 
        }
        .btn-orange { 
            background-color: #ff851b; 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 14px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 8px; 
        }
        .btn-gemini { 
            background-color: #0d6efd; 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 14px; 
            font-weight: bold; 
            border-radius: 8px; 
            text-decoration: none; 
            display: block; 
            margin-top: 8px; 
            text-align: center; 
            display: none; 
        }
        .btn-whatsapp { 
            background-color: #25D366; 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 14px; 
            font-weight: bold; 
            border-radius: 8px; 
            text-decoration: none; 
            display: block; 
            margin-bottom: 15px; 
            text-align: center; 
        }
        
        .property-card { 
            background: #fff; 
            border: 2px solid #1a73e8; 
            padding: 12px; 
            border-radius: 8px; 
            margin-top: 15px;

        }
        .property-text { 
            font-size: 13px; 
            line-height: 1.5;
            white-space: pre-wrap; 
            background: #f9f9f9; 
            padding: 10px; 
            border-radius: 5px; 
            border: 1px solid #ddd; 
            margin-bottom: 10px; 
            text-align: left;

</head>
<body>

    <div class="container">
        <h2>Porbandar Auction & Tenders Portal</h2>

        <!-- DIRECT WHATSAPP GROUP LINK BUTTON -->
        <a href="https://chat.whatsapp.com/GkkqH2u5bB9G8yVain2KdX?s=cl&p=a&mlu=4&ilr=4" target="_blank" class="btn-whatsapp">
            💬 Join Our WhatsApp Group

        <!-- BOX 1: REAL ESTATE BANK AUCTION PROMPT -->

            <div id="bankResultBox" style="display:none; margin-top: 10px;">

                <button class="btn-green" onclick="copyPrompt('bankFinalPrompt', 'bankGeminiBtn')">📋 Copy Property Prompt</button>

            <button class="btn-gold" onclick="prepareGoldPrompt()">🪙 Gold Loan Auction Prompt Banao</button>

            <div id="goldResultBox" style="display:none; margin-top: 10px;">
                <textarea id="goldFinalPrompt" readonly></textarea>
                <button class="btn-green" onclick="copyPrompt('goldFinalPrompt', 'goldGeminiBtn')">📋 Copy Gold Prompt</button>
                <a href="https://gemini.google.com" target="_blank" class="btn-gemini" id="goldGeminiBtn">🌐 Open Gemini & Search Gold</a>
            </div>
        </div>

        <!-- BOX 3: NAGARPALIKA & GOVT COMMERCIAL PLOTS / TENDERS PROMPT -->
        <div class="box-section">
            <div class="section-title">3️⃣ Nagarpalika & Govt Portals Prompt</div>
            <button class="btn-orange" onclick="prepareGovtPrompt()">🏛️ Create Govt/Plot Search Prompt</button>

            <div id="govtResultBox" style="display:none; margin-top: 10px;">
                <textarea id="govtFinalPrompt" readonly></textarea>

                <a href="https://gemini.google.com" target="_blank" class="btn-gemini" id="govtGeminiBtn">🌐 Open Gemini & Tenders</a>
            </div>
        </div>

        <!-- BOX 4: SEPARATE BULK DETAILS INTO INDIVIDUAL CARDS -->
        <div class="box-section">
            <div class="section-title">4️⃣ Gemini Result Paste Karo (Cards)</div>
            <textarea id="bulkInput" placeholder="Gemini ka pura response yahan paste karo..."></textarea>
            <button class="btn-blue" onclick="splitProperties()">✂️ Alag-Alag Cards Banao</button>
            
            <div id="cardsContainer" style="margin-top: 15px;"></div>
        </div>

    </div>

    <script>
        const WA_GROUP_LINK = "https://chat.whatsapp.com/GkkqH2u5bB9G8yVain2KdX?s=cl&p=a&mlu=4&ilr=4";

        const BANK_FORMAT = `Aapko har ek property ki report strictly isi clean Gujarati format me deni hai:

📲 વધુ માહિતી માટે અમારા વોટ્સએપ ગ્રુપમાં જોડાઓ:
${WA_GROUP_LINK}`;

        const GOLD_FORMAT = `Aapko har ek gold loan default auction ki report strictly isi clean Gujarati format me deni hai:

🚨 પોરબંદર બેંક સોનાની હરાજી (Gold Loan Auction Notice) 🚨

📍 બેંક શાખાનું નામ: [Bank Name & Branch Address in Porbandar, Bokhira, Chhaya, etc.]
👤 ગ્રાહક/બોરોઅરનું નામ: [Borrower Name / Account Number]

🔗 લિંક: [Direct Link / N/A]

⚠️ ખાસ નોંધ: આ માહિતી માત્ર જાણકારી માટે છે. બોલી લગાવતા પહેલા બેંક શાખાનો સંપર્ક કરવો.

📲 વધુ માહિતી માટે અમારા વોટ્સએપ ગ્રુપમાં જોડાઓ:
${WA_GROUP_LINK}`;

        const GOVT_FORMAT = `Aapko har ek government tender ya nagarpalika open commercial plot/shop auction ki report strictly isi clean Gujarati format me deni hai:

🏛️ પોરબંદર નગરપાલિકા / સરકારી હરાજી (Government & Municipal Plot Auction) 🏛️

📍 મિલકત વિગત: [Commercial Open Plot / Shop / Work Details]
📍 સંપૂર્ણ સરનામું (Full Address): [Plot/Shop No, Revenue/City Survey No, Area, Taluka (Porbandar/Ranavav/Kutiyana), Gujarat]
👤 મિલકત ધારક / અરજદાર: [Name if available, else N/A]
📐 ક્ષેત્રફળ (Area): [Land Area in Sq Meters / Sq Yards if available, else N/A]
🏢 વિભાગ / સંસ્થા: [Porbandar Nagarpalika / Collector Office / Govt Dept]
💰 રિઝર્વ પ્રાઇસ / ડિપોઝિટ: ₹ [Amount]/-
💵 ઈ.એમ.ડી. રકમ: ₹ [Amount]/-
📅 હરાજી તારીખ / છેલ્લી તારીખ: [Date & Time]
📞 સંપર્ક અધિકારી: [Office / Dealing Officer Name & Phone]
🔗 લિંક: [Direct Link / N/A]

⚠️ ખાસ નોંધ: આ માહિતી માત્ર જાણકારી માટે છે. વિગતવાર માહિતી માટે સંબંધિત કચેરીનો સંપર્ક કરવો.

📲 વધુ માહિતી માટે અમારા વોટ્સએપ ગ્રુપમાં જોડાઓ:
${WA_GROUP_LINK}`;

        function prepareBankPrompt() {
            const today = new Date();
            const dateString = today.getDate() + "/" + (today.getMonth() + 1) + "/" + today.getFullYear();

            const prompt = `Search all ACTIVE & UPCOMING SARFAESI bank auction real estate properties across ALL areas in Porbandar district, Gujarat (including Porbandar City, Bokhira, Chhaya, Khapat, Madhupur, Ranavav, Kutiyana, Ranakandora, and surrounding areas).

TIME RANGE & SOURCES:
- Search active listings for current month AND upcoming NEXT MONTH auction notices (future dates).
- Primary Sources: EAuctions India (eauctions-india.com), IBAPI Portal (ibapi.in), and Public/Private Banks (SBI, Bank of Baroda, HDFC, ICICI, Axis, Bank of India, etc.).

STRICT RULES TO FOLLOW:
1. DATE FILTER: ONLY include auction notices where the Auction Date is AFTER TODAY (${dateString}), including next month and future dates.
2. PRICE MANDATORY: Include exact numerical Reserve Price (Amount in ₹) and EMD Amount. Do NOT write "N/A" for Price or EMD.
3. MANDATORY CONTACT & DIRECT LINK: Strictly include Dealing Officer Name, Mobile/Phone Number, Bank Branch Address, and exact Web URL/Link of the auction listing.
4. DO NOT include any Google Maps links or markdown URL brackets. Write simple plain text.

Har ek property ki report ko strictly is Gujarati format me likho:
${BANK_FORMAT}`;

            document.getElementById("bankFinalPrompt").value = prompt;
            document.getElementById("bankResultBox").style.display = "block";
            document.getElementById("bankGeminiBtn").style.display = "block";
        }

        function prepareGoldPrompt() {
            const today = new Date();
            const dateString = today.getDate() + "/" + (today.getMonth() + 1) + "/" + today.getFullYear();

            const prompt = `Search all active & upcoming Bank Gold Loan default auction notices, public newspaper notices, and pledged gold recovery listings in Porbandar district, Gujarat (including Porbandar City, Bokhira, Chhaya, Khapat, Ranavav, Kutiyana).

SOURCES TO TARGET:
- Official Public Sector & Private Banks (SBI, Bank of Baroda, Bank of India, HDFC, ICICI, Axis, Muthoot Finance, Manappuram Finance branches in Porbandar).
- Local newspaper auction ads published for Porbandar.

STRICT INSTRUCTIONS FOR EXTRACTION:
1. DATE FILTER: Only include auctions scheduled AFTER TODAY (${dateString}), including next month's future dates.
2. DETAILED EXTRACTION: Try to find specific Borrower Name, exact Gold Weight in Grams, and exact Reserve Price/Loan amount if available in public notices. If specific customer name is hidden by the bank, clearly state the branch details and official contact procedure.
3. MANDATORY CONTACT & LINK: Provide the exact branch address, phone number, and official web link.

Har ek gold loan auction ki report strictly is Gujarati format me likho:
${GOLD_FORMAT}`;

            document.getElementById("goldFinalPrompt").value = prompt;
            document.getElementById("goldResultBox").style.display = "block";
            document.getElementById("goldGeminiBtn").style.display = "block";
        }

        function prepareGovtPrompt() {
            const today = new Date();
            const dateString = today.getDate() + "/" + (today.getMonth() + 1) + "/" + today.getFullYear();

            const prompt = `Search active public commercial open plots, land auctions, shop leases, or tenders across ALL areas in Porbandar district, Gujarat (including Porbandar City, Bokhira, Chhaya, Khapat, Ranavav, Kutiyana, and surrounding areas).

TIME RANGE & SOURCES:
- Include current month AND upcoming NEXT MONTH tender/auction dates.
- Sources: Porbandar Nagarpalika, Collectorate notices, GeM Portal (gem.gov.in), and Central Public Procurement Portal (eprocure.gov.in).

STRICT RULES TO FOLLOW:
1. DATE FILTER: ONLY include notices where the Auction / Tender Last Date is AFTER TODAY (${dateString}), covering next month's upcoming dates as well.
2. PRICE MANDATORY: Include exact numerical Reserve Price / Tender Deposit Amount in ₹. Do NOT write "N/A".
3. MANDATORY CONTACT & DIRECT LINK: Include Officer/Department contact person name, phone number, and official online portal link.
4. FULL LEGAL DETAILS: Must include complete full address with Survey numbers, Owner name, and Tender ID.

Har ek item ki report ko strictly is Gujarati format me likho:
${GOVT_FORMAT}`;

            document.getElementById("govtFinalPrompt").value = prompt;
            document.getElementById("govtResultBox").style.display = "block";
            document.getElementById("govtGeminiBtn").style.display = "block";
        }

        function copyPrompt(textareaId, geminiBtnId) {
            const textarea = document.getElementById(textareaId);
            textarea.select();
            document.execCommand("copy");
            alert("✅ Search Prompt Copied! Ab Gemini me paste kar do.");
        }

        function splitProperties() {
            let bulkText = document.getElementById("bulkInput").value.trim();
            const container = document.getElementById("cardsContainer");
            container.innerHTML = ""; 

            if(!bulkText) {
                alert("⚠️ Pehle Gemini ka jawab paste karo!");
                return;
            }

            let firstIndex = bulkText.search(/🚨|🏛️/);
            if (firstIndex !== -1) {
                bulkText = bulkText.substring(firstIndex);
            }

            let rawParts = bulkText.split(/(?=🚨|🏛️)/g);
            let count = 0;

            rawParts.forEach((part) => {
                let cleaned = part.trim();
                if((cleaned.startsWith("🚨") || cleaned.startsWith("🏛️")) && cleaned.length > 50) {
                    count++;
                    let card = document.createElement("div");
                    card.className = "property-card";
                    card.innerHTML = `
                        <div style="font-size: 13px; font-weight: bold; color: #1a73e8; margin-bottom: 8px;">Item #${count}</div>
                        <div class="property-text" id="prop_${count}">${cleaned}</div>
                        <button class="btn-green" onclick="copySpecificProperty('prop_${count}')">📋 Copy Item #${count}</button>
                    `;
                    container.appendChild(card);
                }
            });

            if(count === 0) {
                alert("⚠️ Format match nahi hua. Kripya dhyan dein ki response me 🚨 ya 🏛️ emoji hone chahiye.");
            } else {
                alert(`✅ Total ${count} PURI notices ke complete single cards ban gaye hain!`);
            }
        }

        function copySpecificProperty(elementId) {
            const textElement = document.getElementById(elementId);
            const range = document.createRange();
            range.selectNode(textElement);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand("copy");
            window.getSelection().removeAllRanges();
            alert("✅ Card Copied! Ab WhatsApp group par paste kar do.");
        }
    </script>

</body>
