<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porbandar Property Alerts</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .btn-copy { background: #25D366; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; }
        .btn-copy:active { background: #1da851; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">📍 Porbandar Bank Auction Properties</h2>
    <div id="property-container">
        <!-- Live Data Sheet Se Fetch Hoga -->
    </div>

    <script>
        function copyWhatsApp(title, address, price, bank, branch, photoUrl) {
            let text = `📍 *NEW BANK AUCTION PROPERTY IN PORBANDAR* 📍\n\n` +
                       `🏠 *Property:* ${title}\n` +
                       `📍 *Address:* ${address}\n` +
                       `💰 *Reserve Price:* ${price}\n\n` +
                       `🏦 *Bank Details:*\n` +
                       `• *Bank Name:* ${bank}\n` +
                       `• *Branch:* ${branch}\n\n` +
                       (photoUrl ? `🖼️ *Photo Link:* ${photoUrl}\n\n` : '') +
                       `📲 *Contact for Auction participation details!*`;

            navigator.clipboard.writeText(text).then(() => {
                alert("WhatsApp message copy ho gaya! Ab WhatsApp Group mein paste kar do.");
            });
        }
    </script>
</body>
</html>
