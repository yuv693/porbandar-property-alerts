<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porbandar Bank Auction Property Alerts</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
        h2 { text-align: center; color: #333; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card p { margin: 8px 0; font-size: 15px; color: #444; }
        .card b { color: #111; }
        .btn-copy { background: #25D366; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; text-align: center; display: block; }
        .btn-copy:active { background: #1da851; }
        .loading { text-align: center; font-size: 16px; color: #666; margin-top: 30px; }
    </style>
</head>
<body>

    <h2>📍 Porbandar Bank Auction Properties</h2>
    <div id="property-container">
        <div class="loading">Properties load ho rahi hain...</div>
    </div>

    <script>
        // Google Sheet CSV link (Hum yahan public CSV link connect karenge)
        // Aap apni Google Sheet ko "Anyone with the link can view" karke CSV link yahan daloge
        const sheetID = "YOUR_GOOGLE_SHEET_ID_HERE"; 
        const csvUrl = `https://docs.google.com/spreadsheets/d/17Wi3vFVBZcBHRsktm83lWmx8tJr1w3CU4zMK5GUo_qg/export?format=csv`;

        async function loadProperties() {
            try {
                let response = await fetch(csvUrl);
                let data = await response.text();
                let rows = data.split("\n").map(row => row.split(","));
                
                let container = document.getElementById("property-container");
                container.innerHTML = "";

                // Row 1 header hai, isliye i = 1 se shuru karenge
                for (let i = 1; i < rows.length; i++) {
                    let cols = rows[i];
                    if (cols.length >= 3 && cols[0].trim() !== "") {
                        let title = cols[0].replace(/"/g, '');
                        let city = cols[1] ? cols[1].replace(/"/g, '') : 'Porbandar';
                        let price = cols[2] ? cols[2].replace(/"/g, '') : 'N/A';
                        let marketPrice = cols[3] ? cols[3].replace(/"/g, '') : 'N/A';

                        let card = document.createElement("div");
                        card.className = "card";
                        card.innerHTML = `
                            <p>🏠 <b>Property:</b> ${title}</p>
                            <p>📍 <b>City:</b> ${city}</p>
                            <p>💰 <b>Reserve Price:</b> ₹${price}</p>
                            <p>📈 <b>Market Value:</b> ₹${marketPrice}</p>
                            <button class="btn-copy" onclick="copyWhatsApp('${title}', '${city}', '${price}', '${marketPrice}')">
                                📤 WhatsApp ke liye Copy Karein
                            </button>
                        `;
                        container.appendChild(card);
                    }
                }

                if (container.innerHTML === "") {
                    container.innerHTML = "<p style='text-align:center;'>Koi nayi property nahi mili.</p>";
                }

            } catch (error) {
                console.error("Error loading sheet:", error);
                document.getElementById("property-container").innerHTML = "<p style='text-align:center; color:red;'>Data load karne mein error aaya.</p>";
            }
        }

        function copyWhatsApp(title, city, price, marketPrice) {
            let text = `📍 *NEW BANK AUCTION PROPERTY IN PORBANDAR* 📍\n\n` +
                       `🏠 *Property:* ${title}\n` +
                       `📍 *Location:* ${city}\n` +
                       `💰 *Reserve Price:* ₹${price}\n` +
                       `📈 *Market Value:* ₹${marketPrice}\n\n` +
                       `📲 *Contact for auction details & participate!*`;

            navigator.clipboard.writeText(text).then(() => {
                alert("WhatsApp message copy ho gaya! Ab group mein paste kar do.");
            });
        }

        loadProperties();
    </script>
</body>
</html>
